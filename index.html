<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap Sociologie</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">

    <div class="max-w-4xl mx-auto bg-white p-10 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-10">Roadmap to information and documents</h1>

        <div class="flex flex-col items-center mb-12">
            <div class="bg-gray-800 text-white px-6 py-3 rounded-full font-bold">
                YOU ARE HERE
            </div>
            <div class="w-px h-10 border-l-2 border-dashed border-gray-400 mt-2"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <div class="text-center"><div class="w-16 h-16 rounded-full border-4 border-red-500 mx-auto mb-2 flex items-center justify-center text-2xl">🛡️</div><p class="font-bold">Social Safety</p></div>

            <div class="text-center"><div class="w-16 h-16 rounded-full border-4 border-teal-500 mx-auto mb-2 flex items-center justify-center text-2xl">🎓</div><p class="font-bold">Teaching</p></div>
            <div class="text-center"><div class="w-16 h-16 rounded-full border-4 border-purple-500 mx-auto mb-2 flex items-center justify-center text-2xl">📁</div><p class="font-bold">Department</p></div>
            <div class="text-center"><div class="w-16 h-16 rounded-full border-4 border-orange-500 mx-auto mb-2 flex items-center justify-center text-2xl">🤝</div><p class="font-bold">HR</p></div>
        </div>
    </div>
